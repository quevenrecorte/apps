<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="qCode Apps — Personal developer dashboard and launcher for web apps, tools, and quick links." />
  <title>qCode // Apps</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Ambient canvas background -->
  <canvas id="bg-canvas"></canvas>

  <!-- Scanline overlay -->
  <div class="scanlines" aria-hidden="true"></div>

  <div class="shell">

    <!-- ─── HEADER ─── -->
    <header class="header">
      <div class="header-top">
        <div class="brand">
          <span class="brand-prompt">~/qcode</span>
          <h1 class="brand-title">apps<span class="cursor-blink">_</span></h1>
          <span class="brand-tag">PERSONAL DASHBOARD</span>
        </div>
        <div class="header-meta">
          <div class="status-pill online">
            <span class="pulse-dot"></span>
            <span>ONLINE</span>
          </div>
          <div class="clock-block">
            <div id="clock-time" class="clock-time">--:--:--</div>
            <div id="clock-date" class="clock-date">--- --, ----</div>
          </div>
        </div>
      </div>

      <!-- Search bar -->
      <div class="search-wrap">
        <span class="search-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        </span>
        <input type="text" id="search" autocomplete="off" spellcheck="false"
          placeholder="Search apps, tools, links... [ press / ]" />
        <kbd class="search-shortcut">/</kbd>
      </div>
    </header>

    <!-- ─── TABS ─── -->
    <nav class="tabs-nav" role="tablist">
      <button class="tab-btn active" data-tab="apps" role="tab" aria-selected="true" id="tab-apps">
        <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        Web Apps
      </button>
      <button class="tab-btn" data-tab="business" role="tab" aria-selected="false" id="tab-business">
        <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        Business
      </button>
      <button class="tab-btn" data-tab="server" role="tab" aria-selected="false" id="tab-server">
        <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="2" width="20" height="8" rx="2"/><rect x="2" y="14" width="20" height="8" rx="2"/><line x1="6" y1="6" x2="6.01" y2="6"/><line x1="6" y1="18" x2="6.01" y2="18"/></svg>
        Home Server
      </button>
      <button class="tab-btn" data-tab="batch" role="tab" aria-selected="false" id="tab-batch">
        <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>
        Batch Files
      </button>
      <button class="tab-btn" data-tab="links" role="tab" aria-selected="false" id="tab-links">
        <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
        Quick Links
      </button>
      <button class="tab-btn" data-tab="others" role="tab" aria-selected="false" id="tab-others">
        <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M4.93 4.93a10 10 0 0 0 0 14.14"/></svg>
        Access
      </button>
    </nav>

    <!-- Tab count bar -->
    <div class="tab-meta-bar">
      <span class="tab-count-label">Showing <strong id="visible-count">0</strong> items</span>
      <span class="tab-path" id="tab-path">~/apps</span>
    </div>

    <!-- ─── CONTENT ─── -->
    <main>
      <section id="apps-tab"     class="tab-content active" role="tabpanel"><div id="apps-list"     class="grid"></div></section>
      <section id="business-tab" class="tab-content"        role="tabpanel"><div id="business-list" class="grid"></div></section>
      <section id="server-tab"   class="tab-content"        role="tabpanel"><div id="server-list"   class="grid"></div></section>
      <section id="batch-tab"    class="tab-content"        role="tabpanel"><div id="batch-list"    class="grid"></div></section>
      <section id="links-tab"    class="tab-content"        role="tabpanel"><div id="links-list"    class="grid"></div></section>
      <section id="others-tab"   class="tab-content"        role="tabpanel"><div id="others-list"   class="grid"></div></section>

      <!-- Empty state -->
      <div id="empty-state" class="empty-state hidden">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
        <p>No results for <strong id="empty-query"></strong></p>
        <span>Try a different search term</span>
      </div>
    </main>

    <!-- ─── FOOTER ─── -->
    <footer class="status-bar">
      <span class="status-item">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="10"/></svg>
        qCode v2.0
      </span>
      <span class="status-sep">|</span>
      <span class="status-item" id="footer-tab">apps</span>
      <span class="status-sep">|</span>
      <span class="status-item">Press <kbd>/ </kbd> to search</span>
      <span class="status-spacer"></span>
      <span class="status-item accent" id="footer-time"></span>
    </footer>

  </div>

  <script src="app.js"></script>
</body>
</html>
